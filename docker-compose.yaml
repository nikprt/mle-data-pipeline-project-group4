services:
  postgres:
    image: postgres:17
    container_name: workflow-orchestration-postgres
    environment:
      POSTGRES_DB: ny_taxi_green
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ny_taxi_green"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: